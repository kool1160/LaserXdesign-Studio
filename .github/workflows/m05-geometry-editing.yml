name: M05 Geometry Editing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Run repository guard
        run: py -3 scripts/repository_guard.py

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Audit geometry engine license
        run: pnpm audit:geometry

      - name: Verify M05
        run: pnpm verify

      - name: Upload packaged geometry application
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laserx-m05-windows-unpacked
          path: apps/desktop/dist-packaged/win-unpacked
          if-no-files-found: error
          retention-days: 7
