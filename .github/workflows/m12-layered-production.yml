name: M12 Layered Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Run repository guard
        run: py -3 scripts/repository_guard.py

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Verify M12
        run: pnpm verify

      - name: Upload packaged M12 application and production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laserx-m12-windows-layered-production
          path: |
            apps/desktop/dist-packaged/win-unpacked
            apps/desktop/test-results
            fixtures/production/m12-package-goldens.json
          if-no-files-found: error
          retention-days: 7
