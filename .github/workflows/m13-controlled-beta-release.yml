name: M13 Controlled Beta Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing exact reviewed beta tag (for example v0.13.0-beta.1)
        required: true
        type: string
      confirmation:
        description: Type PUBLISH REVIEWED BETA
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-reviewed-beta:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate owner release gate
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if ($env:RELEASE_CONFIRMATION -cne "PUBLISH REVIEWED BETA") {
            throw "Release confirmation did not match."
          }
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Tag $($env:RELEASE_TAG) does not match package version $version."
          }
          git rev-parse --verify "refs/tags/$($env:RELEASE_TAG)^{commit}" | Out-Null
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -cne $headCommit) {
            throw "Checked-out head does not match the requested tag."
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or
              [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw "WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD GitHub secrets are required."
          }
          $existingRelease = gh release list --limit 100 --json tagName | ConvertFrom-Json |
            Where-Object { $_.tagName -ceq $env:RELEASE_TAG } |
            Select-Object -First 1
          if ($null -ne $existingRelease) {
            throw "A GitHub release already exists for $($env:RELEASE_TAG)."
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact tagged source
        run: pnpm verify

      - name: Build production-signed upgrade fixture
        run: pnpm --filter @laserx/desktop package:installer:upgrade-fixture

      - name: Build production-signed beta with forceCodeSigning
        run: pnpm --filter @laserx/desktop package:installer:signed

      - name: Validate production-signed installer lifecycle
        shell: pwsh
        run: |
          ./scripts/validate-windows-installer.ps1 `
            -UpgradeFixtureInstaller "apps/desktop/dist-packaged-upgrade-fixture/LaserX-Design-Studio-Setup-0.12.99-beta.1-x64.exe" `
            -CurrentInstaller "apps/desktop/dist-packaged/LaserX-Design-Studio-Setup-0.13.0-beta.1-x64.exe" `
            -ExpectedVersion "0.13.0-beta.1"

      - name: Write production provenance
        shell: pwsh
        run: |
          $sourceCommit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          ./scripts/write-release-provenance.ps1 `
            -ArtifactDirectory "apps/desktop/dist-packaged" `
            -ExpectedVersion "0.13.0-beta.1" `
            -SourceCommit $sourceCommit `
            -OutputPath "artifacts/m13/laserx-release-provenance.json"

      - name: Upload immutable workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: laserx-${{ inputs.tag }}-signed
          path: |
            apps/desktop/dist-packaged/LaserX-Design-Studio-Setup-0.13.0-beta.1-x64.exe
            apps/desktop/dist-packaged/*.blockmap
            artifacts/m13/laserx-release-provenance.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish controlled GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create $env:RELEASE_TAG `
            "apps/desktop/dist-packaged/LaserX-Design-Studio-Setup-0.13.0-beta.1-x64.exe" `
            "artifacts/m13/laserx-release-provenance.json" `
            --verify-tag `
            --prerelease `
            --title "LaserX Design Studio 0.13.0-beta.1" `
            --notes-file "docs/releases/0.13.0-beta.1.md"
